name: Android checks and releases

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          distribution: temurin
          java-version: '17'
      - name: Install Android SDK components
        run: |
          sdk_manager="$(find "$ANDROID_HOME/cmdline-tools" -type f -name sdkmanager -print -quit)"
          test -n "$sdk_manager"
          "$sdk_manager" 'platforms;android-36' 'build-tools;36.0.0'
      - name: Test and lint
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon :app:testDebugUnitTest :app:lintDebug :app:lintRelease

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: verify
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: write
    concurrency:
      group: bobtv-publish-release
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          distribution: temurin
          java-version: '17'
      - name: Install Android SDK components
        run: |
          sdk_manager="$(find "$ANDROID_HOME/cmdline-tools" -type f -name sdkmanager -print -quit)"
          test -n "$sdk_manager"
          "$sdk_manager" 'platforms;android-36' 'build-tools;36.0.0'
      - name: Validate version and patch notes
        run: python3 tools/release.py validate --tag "$GITHUB_REF_NAME" --check-published
      - name: Decode existing signing keystore
        env:
          BOBTV_KEYSTORE_BASE64: ${{ secrets.BOBTV_KEYSTORE_BASE64 }}
        run: |
          python3 - <<'PY'
          import base64, os
          from pathlib import Path
          value = os.environ['BOBTV_KEYSTORE_BASE64']
          if not value:
              raise SystemExit('Missing signing keystore secret')
          path = Path(os.environ['RUNNER_TEMP']) / 'bobtv.keystore'
          path.write_bytes(base64.b64decode(value, validate=True))
          path.chmod(0o600)
          PY
      - name: Build signed release APK
        env:
          BOBTV_KEYSTORE_PATH: ${{ runner.temp }}/bobtv.keystore
          BOBTV_KEYSTORE_PASSWORD: ${{ secrets.BOBTV_KEYSTORE_PASSWORD }}
          BOBTV_KEY_ALIAS: ${{ secrets.BOBTV_KEY_ALIAS }}
          BOBTV_KEY_PASSWORD: ${{ secrets.BOBTV_KEY_PASSWORD }}
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon :app:assembleRelease
      - name: Verify and package distribution
        run: python3 tools/release.py package --tag "$GITHUB_REF_NAME" --apk app/build/outputs/apk/release/app-release.apk
      - name: Upload, verify and publish complete release
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 tools/release.py publish --tag "$GITHUB_REF_NAME"
      - name: Remove signing material
        if: always()
        run: rm -f "$RUNNER_TEMP/bobtv.keystore"
